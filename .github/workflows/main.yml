name: Construire NAG Pensee APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet Android
        run: |
          unzip -q NAG_Pensee_Android_V8.zip -d android_project

      - name: Construire APK
        run: |
          cd android_project
          gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: NAG-Pensee-APK
          path: android_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
