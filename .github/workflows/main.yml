name: Construire NAG Pensee APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          unzip -q NAG_Pensee_Android_V7_Final.zip -d android_project
          echo "Projet extrait"

      - name: Trouver Gradle
        run: |
          GRADLE_DIR=$(dirname "$(find android_project -name gradlew -type f | head -n 1)")
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
- name: Construire APK
  run: |
    cd "$GRADLE_DIR"
    chmod +x gradlew
    bash ./gradlew assembleDebug
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NAG-Pensee-APK
          path: "**/build/outputs/apk/**/*.apk"
